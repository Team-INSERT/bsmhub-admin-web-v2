name: Deploy

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_PUBLIC_SUPABASE_URL }}
          VITE_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_PUBLIC_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.VITE_PUBLIC_GOOGLE_CLIENT_ID }}
          VITE_PUBLIC_SITE_URL: ${{ secrets.VITE_PUBLIC_SITE_URL }}
          VITE_VWORLD_API_KEY: ${{ secrets.VITE_VWORLD_API_KEY }}

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH
        run: |
          mkdir -p $HOME/.ssh
          chmod 700 $HOME/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > $HOME/.ssh/id_ed25519
          chmod 600 $HOME/.ssh/id_ed25519
          cat > $HOME/.ssh/config << EOF
          Host deploy-server
            HostName ssh-admin.insert.team
            User root
            IdentityFile $HOME/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 644 $HOME/.ssh/config

      - name: Deploy to server
        run: |
          rsync -avz --delete \
            -e "ssh -F $HOME/.ssh/config" \
            dist/ \
            deploy-server:/usr/share/nginx/html/admin/

      - name: Configure Nginx Vworld proxy
        run: |
          ssh -F $HOME/.ssh/config deploy-server bash -s << 'SCRIPT'
          set -e
          ADMIN_CONF="/etc/nginx/conf.d/bsmhub.conf"
          cp "$ADMIN_CONF" "${ADMIN_CONF}.bak"

          # 1) 이전 깨진 location /vworld-proxy/ 블록 제거
          awk '
          /location \/vworld-proxy\// { skip=1; next }
          skip && /}/ { skip=0; next }
          skip { next }
          { print }
          ' "$ADMIN_CONF" > /tmp/bsmhub_clean.conf

          # 2) server 블록의 마지막 } 앞에 location 삽입 (map 블록 무시)
          awk '
          { lines[NR]=$0; if (/^}/) last=NR }
          END {
              for (i=1; i<=NR; i++) {
                  if (i==last) {
                      print ""
                      print "    location /vworld-proxy/ {"
                      print "        proxy_pass https://api.vworld.kr/;"
                      print "        proxy_set_header Host api.vworld.kr;"
                      print "        proxy_ssl_server_name on;"
                      print "    }"
                  }
                  print lines[i]
              }
          }
          ' /tmp/bsmhub_clean.conf > /tmp/bsmhub_new.conf

          cp /tmp/bsmhub_new.conf "$ADMIN_CONF"

          if nginx -t; then
              nginx -s reload
              echo "Nginx reloaded with Vworld proxy"
          else
              echo "ERROR: config invalid, restoring backup"
              cp "${ADMIN_CONF}.bak" "$ADMIN_CONF"
              nginx -s reload
              exit 1
          fi
          SCRIPT

      - name: Verify deployment
        run: |
          ssh -F $HOME/.ssh/config deploy-server "test -f /usr/share/nginx/html/admin/index.html && echo 'Deploy OK' || (echo 'Deploy FAILED' && exit 1)"
